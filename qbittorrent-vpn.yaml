apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent-vpn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qbittorrent-vpn
  template:
    metadata:
      labels:
        app: qbittorrent-vpn
    spec:
      containers:
      # 1. Gluetun VPN Sidecar
      - name: gluetun
        image: qmcgaw/gluetun:latest
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
        volumeMounts:
        - name: devnettun
          mountPath: /dev/net/tun
        env:
        - name: VPN_TYPE
          value: openvpn
        - name: VPN_SERVICE_PROVIDER
          valueFrom:
            secretKeyRef:
              name: cloudflare-secret
              key: VPN_SERVICE_PROVIDER
        - name: OPENVPN_USER
          valueFrom:
            secretKeyRef:
              name: cloudflare-secret
              key: OPENVPN_USER
        - name: OPENVPN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cloudflare-secret
              key: OPENVPN_PASSWORD
        - name: SERVER_COUNTRIES
          valueFrom:
            secretKeyRef:
              name: cloudflare-secret
              key: SERVER_COUNTRIES
      
      # 2. qBittorrent running alongside the VPN container
      - name: qbittorrent
        image: lscr.io/linuxserver/qbittorrent:latest
        securityContext:
          allowPrivilegeEscalation: false
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: WEBUI_PORT
          value: "8080"
        ports:
        - containerPort: 8080
          name: webui
        volumeMounts:
        - name: qbit-config
          mountPath: /config
        - name: media-storage
          mountPath: /data
      volumes:
      - name: devnettun
        hostPath:
          path: /dev/net/tun
          type: CharDevice
      - name: qbit-config
        persistentVolumeClaim:
          claimName: qbit-config-pvc
      - name: media-storage
        hostPath:
          path: /media  # <-- Update this to match your laptop's actual path
          type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbit-config-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent-svc
spec:
  selector:
    app: qbittorrent-vpn
  ports:
  - port: 8080
    targetPort: 8080
    name: webui
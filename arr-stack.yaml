apiVersion: v1
kind: Namespace
metadata:
  name: media-stack
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbit-config-pvc
  namespace: media-stack
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent-vpn
  namespace: media-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qbittorrent-vpn
  template:
    metadata:
      labels:
        app: qbittorrent-vpn
    spec:
      securityContext:
      #  fsGroup: 1000 # Uncomment if your host mount requires it
      containers:
        - name: gluetun
          image: qmcgaw/gluetun:latest
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          env:
            - name: VPN_SERVICE_PROVIDER
              value: "nordvpn"
            - name: VPN_TYPE
              value: "wireguard"
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: cloudflare-secret
                  key: WIREGUARD_PRIVATE_KEY
            - name: SERVER_CITIES
              value: "Ashburn"
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "America/New_York"
            - name: WEBUI_PORT
              value: "8080"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - mountPath: /config
              name: qbit-config
            - mountPath: /media
              name: media-storage
          ports:
            - containerPort: 8080
              name: webui
      volumes:
        - name: qbit-config
          persistentVolumeClaim:
            claimName: qbit-config-pvc
        - name: media-storage
          hostPath:
            path: /media
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent-svc
  namespace: media-stack
spec:
  selector:
    app: qbittorrent-vpn
  ports:
    - port: 8080
      targetPort: 8080
      name: webui
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: media-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prowlarr
  template:
    metadata:
      labels:
        app: prowlarr
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "America/New_York"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - mountPath: /config
              name: prowlarr-config
          ports:
            - containerPort: 9696
              name: http
      volumes:
        - name: prowlarr-config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prowlarr-svc
  namespace: media-stack
spec:
  selector:
    app: prowlarr
  ports:
    - port: 9696
      targetPort: 9696
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: media-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: take-config-ownership
          image: busybox:latest
          command: ["chown", "-R", "1000:1000", "/config"]
          volumeMounts:
            - mountPath: /config
              name: sonarr-config
          securityContext:
            runAsUser: 0
      containers:
        - name: sonarr
          image: lscr.io/linuxserver/sonarr:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "America/New_York"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: media-storage
              mountPath: /media
            - name: sonarr-config
              mountPath: /config
          ports:
            - containerPort: 8989
              name: http
      volumes:
        - name: media-storage
          hostPath:
            path: /media
            type: Directory
        - name: sonarr-config
          hostPath:
            path: /var/lib/sonarr-config
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: sonarr-svc
  namespace: media-stack
spec:
  selector:
    app: sonarr
  ports:
    - port: 8989
      targetPort: 8989
      name: http

apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
spec:
  replicas: 1
  selector: { matchLabels: { app: prowlarr } }
  template:
    metadata: { labels: { app: prowlarr } }
    spec:
      containers:
      - name: prowlarr
        image: lscr.io/linuxserver/prowlarr:latest
        ports: [{ containerPort: 9696 }]
        volumeMounts: [{ name: config, mountPath: /config }]
      volumes:
      - name: config
        persistentVolumeClaim: { claimName: prowlarr-config-pvc }
---
apiVersion: v1
kind: Service
metadata: { name: prowlarr-svc }
spec:
  selector: { app: prowlarr }
  ports: [{ port: 9696, targetPort: 9696 }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: prowlarr-config-pvc }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
spec:
  replicas: 1
  selector: { matchLabels: { app: sonarr } }
  template:
    metadata: { labels: { app: sonarr } }
    spec:
      containers:
      - name: sonarr
        image: lscr.io/linuxserver/sonarr:latest
        ports: [{ containerPort: 8989 }]
        volumeMounts:
        - { name: config, mountPath: /config }
        - { name: media, mountPath: /data }
      volumes:
      - name: config
        persistentVolumeClaim: { claimName: sonarr-config-pvc }
      - name: media
        hostPath: { path: /path/on/your/laptop/movies, type: Directory }
---
apiVersion: v1
kind: Service
metadata: { name: sonarr-svc }
spec:
  selector: { app: sonarr }
  ports: [{ port: 8989, targetPort: 8989 }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: sonarr-config-pvc }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 2Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
spec:
  replicas: 1
  selector: { matchLabels: { app: radarr } }

        ports: [{ containerPort: 7878 }]
        volumeMounts:
        - { name: config, mountPath: /config }
        - { name: media, mountPath: /data }
      volumes:
      - name: config
        persistentVolumeClaim: { claimName: radarr-config-pvc }
      - name: media
        hostPath: { path: /path/on/your/laptop/movies, type: Directory }
---
apiVersion: v1
kind: Service
metadata: { name: radarr-svc }
spec:
  selector: { app: radarr }
  ports: [{ port: 7878, targetPort: 7878 }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: radarr-config-pvc }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 2Gi } }